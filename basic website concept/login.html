<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="shortcut icon" href="./logo.svg" type="image/x-icon">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="login.css" />
</head>
<body class="auth-body">
<div class="auth">

  <div class="auth__visual" id="auth-visual">
    <div class="auth__slide-layer" id="auth-slide-layer"></div>
    <div class="auth__scrim"></div>
    <div class="auth__visual-content">
      <a class="auth__brand" href="index.html">
      <img src="logo.svg" alt="EOS" height="25" style="display:block;">
      </a>

      <div class="auth__caption">
        <p class="auth__caption-eyebrow" id="auth-caption-eyebrow">Strength</p>
        <h2 id="auth-caption-title">Train like the work actually matters</h2>
        <p id="auth-caption-text">Free weights, machines, and a floor built for serious lifting — open early, open late.</p>
        <div class="auth__dots" id="auth-dots"></div>
      </div>
    </div>
  </div>

  <div class="auth__panel">
    <div class="auth__navbar">
      <a class="auth__navbar-brand" href="index.html">
        <img src="./logo.svg" alt="EOS">
      </a>
    </div>

    <div class="auth__panel-scroll">
    <div class="auth__card">

      <div class="auth__barbell">
        <div class="plate small"></div><div class="plate"></div><div class="plate small"></div>
      </div>

      <div class="auth__head">
        <h1>Welcome back</h1>
        <p>Log in to book classes, track your membership, and keep training. New here? <a href="signup.html">Create an account</a></p>
      </div>

      <form class="auth-form" id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <div class="field__control">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
            <input type="email" id="login-email" name="email" placeholder="you@example.com" required autocomplete="email" />
          </div>
        </div>

        <div class="field field--password">
          <label for="login-password">Password</label>
          <div class="field__control">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="login-password" name="password" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="field__toggle" data-for="login-password" aria-label="Show password"></button>
          </div>
        </div>

        <div class="auth-form__row">
          <label class="checkbox">
            <input type="checkbox" name="remember" checked />
            <span class="checkbox__box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
            </span>
            Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="auth-form__submit" id="login-submit">
          <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9"/></svg>
          <span class="btn-label">Log In</span>
        </button>
      </form>

      <div class="auth__divider">or continue with</div>

      <div class="auth__social">
        <button type="button" class="auth__social-btn">
          <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.2s2.7-6.2 6-6.2c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3.3 14.7 2.3 12 2.3 6.9 2.3 2.7 6.5 2.7 12s4.2 9.7 9.3 9.7c5.4 0 9-3.8 9-9.1 0-.6-.06-1.1-.15-1.6H12z"/></svg>
          Continue with Google
        </button>
        <button type="button" class="auth__social-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 12.5c0-2.8 2.3-4.1 2.4-4.2-1.3-1.9-3.3-2.1-4-2.2-1.7-.2-3.3 1-4.2 1-.9 0-2.2-1-3.6-1-1.9 0-3.6 1.1-4.6 2.8-2 3.4-.5 8.5 1.4 11.3.9 1.3 2 2.9 3.5 2.8 1.4-.05 1.9-.9 3.6-.9s2.2.9 3.6.9c1.5 0 2.5-1.4 3.4-2.7 1.1-1.6 1.5-3.1 1.5-3.2-.03-.02-3-1.15-3-4.6zM14.5 3.9c.8-1 1.3-2.3 1.2-3.7-1.2.05-2.6.8-3.4 1.8-.7.9-1.3 2.2-1.2 3.6 1.3.1 2.6-.7 3.4-1.7z"/></svg>
          Continue with Apple
        </button>
      </div>

    </div>
    </div>
  </div>

</div>

<script>window.AUTH_SLIDES = [
  { img: 'https://images.unsplash.com/photo-1541600383005-565c949cf777?auto=format&fit=crop&w=1400&q=80', eyebrow: 'Strength', title: 'Train like the work actually matters', text: 'Free weights, machines, and a floor built for serious lifting — open early, open late.' },
  { img: 'https://images.unsplash.com/photo-1754257319747-df51c384c0fa?auto=format&fit=crop&w=1400&q=80', eyebrow: 'Pilates', title: 'Balance and control, session after session', text: 'Reformer and mat classes led by instructors who actually watch your form.' },
  { img: 'https://images.unsplash.com/photo-1517130038641-a774d04afb3c?auto=format&fit=crop&w=1400&q=80', eyebrow: 'Community', title: 'A gym that knows your name', text: 'Group classes, a members-only app, and a front desk that remembers your goals.' },
];</script>
<script src="eos-auth.js"></script>
<script>
  initFakeSubmit('login-form', 'login-submit', () => { window.location.href = 'eos-fitness-app.html'; });
</script>
</body>
</html>
